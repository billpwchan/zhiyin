<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b0b0c">
<title>知音</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-top">
      <a class="mark" href="#" aria-label="知音" data-i18n-label="知音"><svg class="lg" viewBox="8 26 84 52" aria-hidden="true"><path d="M14 70 C21 70 26 36 37 36 C48 36 49 70 61 70 C75 70 86 62 86 49 C86 37 77 30 67 33"/><circle cx="69" cy="52" r="7"/></svg><span class="wm-t" data-i18n="知音">知音</span></a>
      <button class="me-mini" data-k="menu" aria-label="账号" data-i18n-label="账号"></button>
    </div>
    <nav class="rail-nav">
      <button class="ask-open" data-k="ask" id="askOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span data-i18n="想听点什么">想听点什么</span><kbd>/</kbd></button>
      <a class="nav" href="#ear" id="earLink"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span data-i18n="你的耳朵">你的耳朵</span></a>
    </nav>
    <div class="stations" id="stations" aria-label="电台" data-i18n-label="电台"></div>
    <div class="pcard" id="pcard" hidden>
      <div class="pc-frame" id="pcFrame" data-k="toggle"><img class="art" id="dArt" alt=""></div>
      <div class="pc-src" data-i18n="在 YouTube 播放">在 YouTube 播放</div>
      <div class="pc-meta">
        <a class="pc-txt" href="#" title="回到电台" data-i18n-title="回到电台"><span class="tt" id="dTitle"></span><span class="ar" id="dArtist"></span></a>
        <div class="pc-ctl"></div>
      </div>
    </div>
    <button class="me" id="meBtn" data-k="menu" aria-haspopup="menu"></button>
  </aside>
  <main class="view" id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="导航" data-i18n-label="导航">
  <a href="#" data-tab="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a8 8 0 0 1 16 0"/><rect x="3" y="13.5" width="4" height="6.5" rx="1.5"/><rect x="17" y="13.5" width="4" height="6.5" rx="1.5"/></svg><span data-i18n="电台">电台</span></a>
  <button data-k="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span data-i18n="点歌">点歌</span></button>
  <a href="#ear" data-tab="ear"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span data-i18n="你的耳朵">你的耳朵</span></a>
</nav>
<div class="yt-host" id="ytHost" hidden><div id="ytA"></div></div>
<dialog class="composer" id="composer" aria-label="点歌" data-i18n-label="点歌">
  <form class="ask" id="ask" autocomplete="off" method="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="askInput" name="q" placeholder="想听点什么？说说场景或心情" data-i18n-ph="想听点什么？说说场景或心情" enterkeyhint="go">
    <kbd>↵</kbd>
  </form>
  <div class="c-body" id="cBody"></div>
</dialog>
<div class="menu" id="menu" popover role="menu"></div>
<dialog class="sheet" id="sheet" aria-label="设置" data-i18n-label="设置"></dialog>
<dialog class="join" id="join" aria-label="加入知音" data-i18n-label="加入知音"></dialog>
<dialog class="keys-d" id="keysD" aria-label="快捷键" data-i18n-label="快捷键"></dialog>
<dialog class="note-d" id="noteD" aria-label="告诉这个电台" data-i18n-label="告诉这个电台"></dialog>
<dialog class="share-d" id="shareD" aria-label="分享" data-i18n-label="分享"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
