[project]
name = "zhiyin"
version = "0.1.0"
description = "A personal music editor for your YouTube Music likes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bill Chan" }]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencc>=1.4.2",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
    "ytmusicapi>=1.12.3,<2",
]

# The audio model only runs on the Mac (`zhiyin listen`, `zhiyin worker`); the server image skips this group.
[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]
audio = [
    "muq==0.1.0",
    "torch>=2.14.1",
    "transformers==4.49.0",
]

[tool.uv]
default-groups = ["audio"]

[project.urls]
Homepage = "https://github.com/billpwchan/zhiyin"

[project.scripts]
zhiyin = "zhiyin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# `l` for a lane or a line is used throughout
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
